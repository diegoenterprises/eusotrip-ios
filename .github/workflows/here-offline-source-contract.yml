name: HERE Offline Source Contract

on:
  pull_request:
    paths:
      # The app-radio-silence boundary spans API, realtime, WebKit, helpers,
      # role callers, and the paired Watch process. Any Swift change can add a
      # transport sink, so PR enforcement must not be limited to Offline/.
      - "EusoTrip/**/*.swift"
      - "EusoTrip Pulse Watch App/**/*.swift"
      - "EusoTrip Pulse Watch AppTests/**/*.swift"
      - "EusoTrip/Services/HereMaps/Offline/**"
      - "EusoTrip/Views/Maps/Offline/**"
      - "EusoTripOfflineTests/**"
      - "EusoTrip.xcodeproj/project.pbxproj"
      - "EusoTrip.xcodeproj/xcshareddata/xcschemes/EusoTrip.xcscheme"
      - "scripts/*here-offline*"
      - "scripts/verify-reachable-here-credential-history*"
      - "scripts/*release*"
      - "scripts/asc-*.mjs"
      - "scripts/preflight-exported-ipa*"
      - "scripts/verify-exported-ipa-app-binding*"
      - "scripts/hash-release-artifact*"
      - "scripts/select-available-ios-simulator*"
      - "security/HERE_*.json"
      - ".github/workflows/here-offline-source-contract.yml"
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_approval:
        description: "Request the protected HERE offline release-environment approval receipt"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: here-offline-source-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-contract:
    name: HERE Offline Source Contract
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout complete source history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Fetch and prove every public incident-relevant ref
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force --prune origin \
            '+refs/heads/*:refs/remotes/origin/*' \
            '+refs/tags/*:refs/tags/*' \
            '+refs/pull/*/head:refs/remotes/pull/*/head' \
            '+refs/pull/*/merge:refs/remotes/pull/*/merge'
          remote_inventory="$RUNNER_TEMP/eusotrip-remote-ref-inventory"
          git ls-remote origin \
            'refs/heads/*' 'refs/tags/*' 'refs/pull/*/head' 'refs/pull/*/merge' > "$remote_inventory"
          while read -r object_id ref_name; do
            if ! git cat-file -e "${object_id}^{commit}" 2>/dev/null; then
              echo "Remote ref inventory is not fully materialized; refusing a partial history verdict." >&2
              exit 1
            fi
          done < "$remote_inventory"
          if [[ -n "$(git log --all --format= --name-only -- .build_copy.log .build_copy2.log)" ]]; then
            echo "Incident build-log paths remain reachable from fetched Git refs." >&2
            exit 1
          fi
          node scripts/verify-reachable-here-credential-history.mjs \
            --repository="$GITHUB_WORKSPACE"

      - name: Validate release-control syntax and fixtures
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/deploy-testflight.sh
          plutil -lint scripts/exportOptions.testflight.plist
          node --test scripts/asc-latest-build.test.mjs
          node scripts/asc-build-status.test.mjs
          node scripts/hash-release-artifact.test.mjs
          node scripts/preflight-exported-ipa.test.mjs
          node scripts/verify-exported-ipa-app-binding.test.mjs
          node scripts/release-ladder-status.test.mjs
          node scripts/select-available-ios-simulator.test.mjs
          node scripts/verify-release-config-attestation.test.mjs
          node scripts/verify-here-offline-device-acceptance.test.mjs
          node scripts/verify-github-release-governance.test.mjs
          node --test scripts/verify-reachable-here-credential-history.test.mjs
          node scripts/verify-here-offline-contract.test.mjs
          node scripts/here-production-gate.mjs
          node scripts/verify-here-offline-contract.mjs
          trusted_clock_binary="$RUNNER_TEMP/canonical-route-trusted-clock-verify"
          swiftc -swift-version 5 -parse-as-library \
            EusoTrip/Services/HereMaps/Offline/Core/OfflineMapModels.swift \
            EusoTrip/Services/HereMaps/Offline/Core/OfflineRouteModels.swift \
            EusoTrip/Services/HereMaps/Offline/Core/CanonicalRouteTrustedClock.swift \
            EusoTrip/Services/HereMaps/Offline/Core/CanonicalRoutePackageStore.swift \
            scripts/verify-canonical-route-trusted-clock.swift \
            -o "$trusted_clock_binary"
          "$trusted_clock_binary"
          coverage_clock_binary="$RUNNER_TEMP/signed-coverage-trusted-time-verify"
          swiftc -DSIGNED_COVERAGE_SOURCE_VERIFICATION \
            -warnings-as-errors -strict-concurrency=complete -warn-concurrency \
            -parse-as-library -module-name EusoTrip \
            EusoTrip/Services/HereMaps/Offline/Core/OfflineMapModels.swift \
            EusoTrip/Services/HereMaps/Offline/Core/OfflineRouteModels.swift \
            EusoTrip/Services/HereMaps/Offline/Core/SignedInstalledCoverageResolver.swift \
            EusoTripOfflineTests/SignedInstalledCoverageResolverTests.swift \
            -o "$coverage_clock_binary"
          "$coverage_clock_binary"
          app_radio_silence_binary="$RUNNER_TEMP/app-radio-silence-lease-verify"
          swiftc -DAPP_RADIO_SILENCE_SOURCE_VERIFICATION \
            -warnings-as-errors -strict-concurrency=complete -warn-concurrency \
            -parse-as-library -module-name EusoTrip \
            EusoTrip/Services/HereMaps/Offline/Core/AppRadioSilenceLeaseState.swift \
            EusoTripOfflineTests/AppRadioSilenceLeaseStateTests.swift \
            -o "$app_radio_silence_binary"
          "$app_radio_silence_binary"
          watch_radio_silence_binary="$RUNNER_TEMP/app-radio-silence-watch-state-verify"
          swiftc -DAPP_RADIO_SILENCE_WATCH_SOURCE_VERIFICATION \
            -warnings-as-errors -strict-concurrency=complete -warn-concurrency \
            -parse-as-library -module-name EusoTripPulseWatchApp \
            "EusoTrip Pulse Watch App/Services/AppRadioSilenceWatchState.swift" \
            "EusoTrip Pulse Watch AppTests/AppRadioSilenceWatchStateTests.swift" \
            -o "$watch_radio_silence_binary"
          "$watch_radio_silence_binary"

      - name: Compile the offline test bundle without launching Simulator
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild build-for-testing \
            -project EusoTrip.xcodeproj \
            -scheme EusoTrip \
            -configuration Debug \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath "$RUNNER_TEMP/EusoTripOfflineContractDerivedData" \
            -xcconfig EusoTrip.xcconfig.sample \
            -only-testing:EusoTripOfflineTests \
            -parallelizeTargets NO \
            CODE_SIGNING_ALLOWED=NO

      # Never upload the proprietary HERE SDK, signing inputs, release
      # configuration, raw device captures, or extracted app products from
      # this public-repository workflow.

  release-approval:
    name: HERE Offline Release Approval
    if: github.event_name == 'workflow_dispatch' && inputs.release_approval
    needs: source-contract
    runs-on: macos-15
    timeout-minutes: 5
    environment:
      name: here-offline-release
    steps:
      - name: Bind approval to the checked main commit
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" || ! "$GITHUB_SHA" =~ ^[a-f0-9]{40}$ ]]; then
            echo "Release approval must target one exact main commit." >&2
            exit 1
          fi
          echo "Protected HERE offline release approval recorded for ${GITHUB_SHA}."
